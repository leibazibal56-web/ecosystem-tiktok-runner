name: Ecosystem Daily TikTok Video Generator (30 Apps Cloud Runner)

on:
  schedule:
    # Rulează la fiecare 30 de minute între 05:00 și 20:00 UTC (08:00 - 23:00 ora României)
    - cron: '0,30 5-20 * * *'
  workflow_dispatch:
    inputs:
      target_app:
        description: 'ID aplicație (ex: intelligent-studio, lexsinteza, medstudio), listă separată prin virgulă, due, sau all'
        required: false
        default: 'intelligent-studio'

jobs:
  generate_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system fonts & FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core fonts-liberation ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow edge-tts imageio-ffmpeg python-dotenv google-genai

      - name: Run Ecosystem TikTok Generator & Dispatch to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_APP: ${{ github.event.inputs.target_app || 'due' }}
          PYTHONIOENCODING: utf-8
        run: |
          python run_cloud_tiktok.py "$TARGET_APP"
